services:
  auth-database:
    container_name: auth-service-database
    image: postgres:18
    environment:
      POSTGRES_DB: dev_auth_database
      POSTGRES_USER: developer
      POSTGRES_PASSWORD: 12345678
    ports:
      - "5433:5432"
    volumes:
      - "auth_data:/var/lib/postgresql"
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U developer -d dev_database" ]
      interval: 5s
      timeout: 15s
      retries: 5

volumes:
  auth_data:
